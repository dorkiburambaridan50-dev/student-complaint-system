<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Student Portal</title>
    <link href="src/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-olive sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><img src="fuet.png.jpg" alt=""></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="topNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="submit-complaint.html">Lodge Complaint</a></li>
                    <li class="nav-item"><a class="nav-link" href="track-complaint.html">Track Complaint</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Support</a></li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm px-3 ms-lg-2 active" href="login.html">Sign In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Dedicated Login Container -->
    <main class="container my-5 d-flex justify-content-center align-items-center">
        <div class="card border-0 shadow col-md-6 col-lg-5 p-0">
            <div class="card-header card-header-olive p-3 text-center">
                <h4 class="mb-0 fw-bold">Student Sign In</h4>
            </div>
            <div class="card-body p-4">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="matricNo" class="form-label fw-semibold">Matriculation Number</label>
                        <input type="text" class="form-control" id="matricNo" placeholder="e.g. FT/2025/79037" required>
                    </div>
                    <div class="mb-3">
                        <label for="studentPin" class="form-label fw-semibold">Security PIN</label>
                        <input type="password" class="form-control" id="studentPin" maxlength="20" placeholder="Enter PIN" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="support.html" class="text-decoration-none small text-olive">Forgot PIN?</a>
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-olive w-100 py-2">Sign In</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center small">
            &copy; 2026 Student Complaint & Feedback System. All rights reserved.
        </div>
    </footer>

    <script src="src/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const matric = document.getElementById('matricNo').value.trim();
            const pin = document.getElementById('studentPin').value.trim();
            
            if (matric && pin) {
                localStorage.setItem('userMatric', matric);
                alert(`Login Successful! Authenticated as ${matric}`);
                window.location.href = 'submit-complaint.html';
            }
        });
    </script>
</body>
</html>
